readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.4",
    "sse-starlette>=3.0.3",
    "uvicorn>=0.38.0",
    "typer>=0.12.3",
    "ruff>=0.14.10",
    "python-dotenv>=1.2.1",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.6",
    "a2a-sdk[grpc]>=1.0.1",
    "pyjwt[crypto]>=2.13.0",
]
